services:
  api:
    container_name: localai
    image: localai/localai:latest-gpu-nvidia-cuda-12
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 1m
      timeout: 20m
      retries: 5
    shm_size: 2gb
    volumes:
      - ./models:/models
    network_mode: host
    environment:
      - LOCALAI_DISABLE_GUESSING=true
      # Force llama.cpp parameters to skip MTP nextn sequence evaluation
      - LLAMACPP_ARGS="--cont-batching=false"
      - LOCALAI_MODEL_LOAD_FAILURE_COOLDOWN=0
    restart: always
    # CDI driver configuration (recommended for NVIDIA Container Toolkit 1.14+)
    # This uses the nvidia.com/gpu resource API
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: 1
