name: Deploy Compose file for Authelia

on:
  workflow_dispatch:
    inputs:
      DEPLOY_HOST:
        description: Optional target hostname (alienware.headscale.node or nextcloud.headscale.node); leave blank for both.
        required: false
        type: string
        default: "alienware.headscale.node"
      compose_deploy_docker_stack_name:
        description: Stack name override for selected host(s).
        required: true
        type: string
        default: localai
      compose_deploy_docker_compose_file:
        description: Compose file override, relative to each stack path.
        required: true
        type: string
        default: docker-compose.yml
      deploy_user:
        description: User to connect to the hosts.
        required: false
        type: string
        default: "gregory"
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  deploy:
    uses: gregoryca/apex-migrations-framework/.github/workflows/deploy-compose.yml@main
    with:
      DEPLOY_HOST: ${{ inputs.DEPLOY_HOST }}
      compose_deploy_docker_stack_name: ${{ inputs.compose_deploy_docker_stack_name }}
      compose_deploy_docker_compose_file: ${{ inputs.compose_deploy_docker_compose_file }}
      compose_deploy_docker_stack_path: ${{ inputs.compose_deploy_docker_stack_path }}
      deploy_user: ${{ inputs.deploy_user }}
    secrets:
      ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
